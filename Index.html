    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#090514',
                            card: '#0f0a1c',
                            purple: '#a855f7',
                            violet: '#8b5cf6',
                            cyan: '#06b6d4',

    <!-- Google Fonts: Orbitron & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #090514;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Cyber Grid Pattern Background */
        .cyber-grid {
            background-image: 
                linear-gradient(to right, rgba(168, 85, 247, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* Lightweight Cyber Glassmorphism */
        .cyber-glass {
            background: rgba(15, 10, 28, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(168, 85, 247, 0.05);
            transform: translate3d(0, 0, 0);
            will-change: transform, border-color, box-shadow;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .cyber-glass:hover, .cyber-glass:active {
            border-color: rgba(6, 182, 212, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7), 0 0 15px rgba(6, 182, 212, 0.25);
        }

        /* Cyberpunk Neon Glow Buttons */
        .btn-cyber-primary {
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4), 0 0 10px rgba(6, 182, 212, 0.3);
            transform: translate3d(0, 0, 0);
            will-change: transform, box-shadow;
            transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s ease;
        }

        .btn-cyber-primary:active {
            transform: translate3d(0, 0, 0) scale(0.96);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
        }

        .btn-cyber-pink {
            background: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
        }

        /* Pulse Animation for Neon Badges */
        .pulse-neon {
            will-change: transform, opacity;
            animation: cyberPulse 2.5s infinite ease-in-out;
        }

        @keyframes cyberPulse {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.6)); }
            50% { transform: translate3d(0, 0, 0) scale(1.04); filter: drop-shadow(0 0 16px rgba(6, 182, 212, 0.8)); }
        }

        /* Dynamic Canvas Layer */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>

    <!-- HIGH PERFORMANCE CANVAS CYBER ANIMATION -->
    <script>
        window.onload = function() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            // Dua orbs bercahaya cyberpunk (Purple & Cyan) untuk akselerasi smooth di mobile
            const orbs = [
                { x: width * 0.25, y: height * 0.25, radius: 200, dx: 0.25, dy: 0.15, color: 'rgba(168, 85, 247, 0.15)' },
                { x: width * 0.75, y: height * 0.75, radius: 240, dx: -0.2, dy: -0.25, color: 'rgba(6, 182, 212, 0.12)' }
            ];

            function animateCanvas() {
                ctx.clearRect(0, 0, width, height);

                orbs.forEach(orb => {
                    orb.x += orb.dx;
                    orb.y += orb.dy;

                    if (orb.x < -100 || orb.x > width + 100) orb.dx *= -1;
                    if (orb.y < -100 || orb.y > height + 100) orb.dy *= -1;

                    const grad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.radius);
                    grad.addColorStop(0, orb.color);
                    grad.addColorStop(1, 'transparent');

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
                    ctx.fill();
                });

                requestAnimationFrame(animateCanvas);
            }

            animateCanvas();
        };

        function tsaqifApp() {
            return {
                currentView: 'home',
                filterStatus: 'semua',
                showDeleteModal: false,
                selectedIdToDelete: null,
                form: {
                    keterangan: '',
                    nominal: ''
                },
                pemasukanList: JSON.parse(localStorage.getItem('tsaqif_pemasukan')) || [],

                init() {
                    this.$watch('pemasukanList', (value) => {
                        localStorage.setItem('tsaqif_pemasukan', JSON.stringify(value));
                    });
                },

                tambahPemasukan() {
                    if (!this.form.keterangan || !this.form.nominal) return;

                    const now = new Date();
                    const optionsTanggal = { day: 'numeric', month: 'long', year: 'numeric' };
                    const tanggalFormatted = now.toLocaleDateString('id-ID', optionsTanggal);
                    const waktuFormatted = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';

                    const newItem = {
                        id: Date.now(),
                        keterangan: this.form.keterangan,
                        nominal: Number(this.form.nominal),
                        tanggal: tanggalFormatted,
                        waktu: waktuFormatted,
                        sudahDitarik: false,
                        timestamp: now.getTime()
                    };

                    this.pemasukanList.unshift(newItem);
                    this.form.keterangan = '';
                    this.form.nominal = '';
                },

                toggleStatus(id) {
                    const item = this.pemasukanList.find(i => i.id === id);
                    if (item) {
                        item.sudahDitarik = !item.sudahDitarik;
                    }
                },

                bukaModalHapus(id) {
                    this.selectedIdToDelete = id;
                    this.showDeleteModal = true;
                },

                tutupModalHapus() {
                    this.showDeleteModal = false;
                    this.selectedIdToDelete = null;
                },

                konfirmasiHapus() {
                    if (this.selectedIdToDelete !== null) {
                        this.pemasukanList = this.pemasukanList.filter(i => i.id !== this.selectedIdToDelete);
                        this.tutupModalHapus();
                    }
                },

                get filteredList() {
                    if (this.filterStatus === 'belum') {
                        return this.pemasukanList.filter(i => !i.sudahDitarik);
                    } else if (this.filterStatus === 'sudah') {
                        return this.pemasukanList.filter(i => i.sudahDitarik);
                    }
                    return this.pemasukanList;
                },

                get totalPemasukan() {
                    return this.pemasukanList.reduce((sum, item) => sum + item.nominal, 0);
                },

                get totalSudahDitarik() {
                    return this.pemasukanList
                        .filter(item => item.sudahDitarik)
                        .reduce((sum, item) => sum + item.nominal, 0);
                },

                get totalBelumDitarik() {
                    return this.pemasukanList
                        .filter(item => !item.sudahDitarik)
                        .reduce((sum, item) => sum + item.nominal, 0);
                },

                formatRupiah(angka) {
                    return new Intl.NumberFormat('id-ID', {
                        style: 'currency',
                        currency: 'IDR',
                        maximumFractionDigits: 0
                    }).format(angka || 0);
                }
            }
        }
    </script>
</body>
</html>
